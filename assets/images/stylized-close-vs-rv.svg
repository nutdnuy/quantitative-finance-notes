<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="555" viewBox="0 0 1000 555" role="img" aria-labelledby="title desc">
<title id="title">An unchanged close can hide intraday movement</title><desc id="desc">Both hypothetical paths begin and end at 100. Alternating log returns of 1% give realized volatility 2%; alternating log returns of 0.2% give 0.4%.</desc>
<rect width="1000" height="555" fill="white"/>
<g font-family="Arial, sans-serif"><text x="40" y="48" font-size="28" fill="#232326" text-anchor="start">An unchanged close can hide intraday movement</text><text x="40" y="82" font-size="17" fill="#64646b" text-anchor="start">Two constructed paths · four intervals · no dividends · identical starting and closing prices</text><line x1="110" y1="365.9999999999994" x2="850" y2="365.9999999999994" stroke="#dddddf" stroke-width="2" stroke-dasharray=""/><text x="90" y="370.9999999999994" font-size="16" fill="#64646b" text-anchor="end">100.0</text><line x1="110" y1="255.99999999999937" x2="850" y2="255.99999999999937" stroke="#dddddf" stroke-width="2" stroke-dasharray=""/><text x="90" y="260.9999999999994" font-size="16" fill="#64646b" text-anchor="end">100.5</text><line x1="110" y1="145.99999999999937" x2="850" y2="145.99999999999937" stroke="#dddddf" stroke-width="2" stroke-dasharray=""/><text x="90" y="150.99999999999937" font-size="16" fill="#64646b" text-anchor="end">101.0</text><polyline points="110.000,366.000 295.000,144.896 480.000,366.000 665.000,144.896 850.000,366.000" fill="none" stroke="#6200ee" stroke-width="3"/><circle cx="110" cy="366.000" r="4" fill="#6200ee"/><circle cx="295" cy="144.896" r="4" fill="#6200ee"/><circle cx="480" cy="366.000" r="4" fill="#6200ee"/><circle cx="665" cy="144.896" r="4" fill="#6200ee"/><circle cx="850" cy="366.000" r="4" fill="#6200ee"/><polyline points="110.000,366.000 295.000,321.956 480.000,366.000 665.000,321.956 850.000,366.000" fill="none" stroke="#008577" stroke-width="3"/><circle cx="110" cy="366.000" r="4" fill="#008577"/><circle cx="295" cy="321.956" r="4" fill="#008577"/><circle cx="480" cy="366.000" r="4" fill="#008577"/><circle cx="665" cy="321.956" r="4" fill="#008577"/><circle cx="850" cy="366.000" r="4" fill="#008577"/><text x="110" y="112" font-size="16" fill="#64646b" text-anchor="start">Price</text><text x="110" y="488" font-size="19" fill="#6200ee" text-anchor="start">Larger swings: √RV = 2.0%</text><text x="560" y="488" font-size="19" fill="#008577" text-anchor="start">Smaller swings: √RV = 0.4%</text><text x="110" y="449" font-size="16" fill="#64646b" text-anchor="middle">0</text><text x="295" y="449" font-size="16" fill="#64646b" text-anchor="middle">1</text><text x="480" y="449" font-size="16" fill="#64646b" text-anchor="middle">2</text><text x="665" y="449" font-size="16" fill="#64646b" text-anchor="middle">3</text><text x="850" y="449" font-size="16" fill="#64646b" text-anchor="middle">4</text><text x="850" y="528" font-size="17" fill="#64646b" text-anchor="end">Observation index</text></g></svg>