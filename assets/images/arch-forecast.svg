<title id="title">Persistence determines how slowly forecast risk declines</title><desc id="desc">Calculated 60-day forecasts start at variance 0.000164 and share long-run variance 0.0001. The y axis is daily forecast standard deviation in percent, not annualized. Persistence values 0.80, 0.95 and 0.99 yield variance-excess half-lives of 3.11, 13.51 and 68.97 days.</desc>
