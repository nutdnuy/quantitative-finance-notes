<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="optimization-types-title optimization-types-desc"><title id="optimization-types-title">Four optimization problems differ by the feasible set</title><desc id="optimization-types-desc">Four panels compare unconstrained optimization, an equality constraint, an inequality constraint and benchmark-relative active weights.</desc><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Roboto, Noto Sans Thai, Arial, sans-serif"><text x="44.00" y="48.00" font-size="28" fill="#202124" text-anchor="start" font-weight="600">Four optimization problems differ by the feasible set</text><text x="44.00" y="80.00" font-size="16" fill="#64666B" text-anchor="start" font-weight="400">The objective may stay the same while the admissible answer changes.</text><defs><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#202124"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6200EE"/></marker></defs><rect x="50.00" y="112.00" width="500.00" height="220.00" rx="8" fill="#FFFFFF" stroke="#E3E3E8" stroke-width="1"/><rect x="50.00" y="112.00" width="500.00" height="46.00" rx="8" fill="#EFE7FA" stroke="none" stroke-width="1"/><text x="68.00" y="142.00" font-size="18" fill="#202124" text-anchor="start" font-weight="600">1  Unconstrained</text><rect x="570.00" y="112.00" width="500.00" height="220.00" rx="8" fill="#FFFFFF" stroke="#E3E3E8" stroke-width="1"/><rect x="570.00" y="112.00" width="500.00" height="46.00" rx="8" fill="#E3F4F1" stroke="none" stroke-width="1"/><text x="588.00" y="142.00" font-size="18" fill="#202124" text-anchor="start" font-weight="600">2  Equality constraint</text><rect x="50.00" y="365.00" width="500.00" height="220.00" rx="8" fill="#FFFFFF" stroke="#E3E3E8" stroke-width="1"/><rect x="50.00" y="365.00" width="500.00" height="46.00" rx="8" fill="#F4F4F6" stroke="none" stroke-width="1"/><text x="68.00" y="395.00" font-size="18" fill="#202124" text-anchor="start" font-weight="600">3  Inequality constraint</text><rect x="570.00" y="365.00" width="500.00" height="220.00" rx="8" fill="#FFFFFF" stroke="#E3E3E8" stroke-width="1"/><rect x="570.00" y="365.00" width="500.00" height="46.00" rx="8" fill="#EFE7FA" stroke="none" stroke-width="1"/><text x="588.00" y="395.00" font-size="18" fill="#202124" text-anchor="start" font-weight="600">4  Benchmark-relative</text><ellipse cx="300.00" cy="252.00" rx="115.00" ry="58.00" fill="none" stroke="#6200EE" stroke-width="2"/><ellipse cx="300.00" cy="252.00" rx="80.00" ry="40.00" fill="none" stroke="#6200EE" stroke-width="2"/><ellipse cx="300.00" cy="252.00" rx="44.00" ry="22.00" fill="none" stroke="#6200EE" stroke-width="2"/><circle cx="300.00" cy="252.00" r="7.00" fill="#6200EE" stroke="#FFFFFF" stroke-width="2"/><text x="430.00" y="214.00" font-size="15" fill="#64666B" text-anchor="start" font-weight="400">search all x</text><text x="318.00" y="258.00" font-size="16" fill="#6200EE" text-anchor="start" font-weight="600">x*</text><ellipse cx="820.00" cy="252.00" rx="115.00" ry="58.00" fill="none" stroke="#64666B" stroke-width="1.5"/><ellipse cx="820.00" cy="252.00" rx="80.00" ry="40.00" fill="none" stroke="#64666B" stroke-width="1.5"/><ellipse cx="820.00" cy="252.00" rx="44.00" ry="22.00" fill="none" stroke="#64666B" stroke-width="1.5"/><line x1="658.00" y1="299.00" x2="982.00" y2="198.00" stroke="#007F73" stroke-width="4"/><circle cx="879.00" cy="230.00" r="7.00" fill="#007F73" stroke="#FFFFFF" stroke-width="2"/><text x="652.00" y="314.00" font-size="15" fill="#007F73" text-anchor="start" font-weight="600">g(x) = b</text><text x="893.00" y="225.00" font-size="14" fill="#202124" text-anchor="start" font-weight="400">best feasible x</text><polygon points="120.00,550.00 120.00,449.00 480.00,550.00" fill="#E3F4F1" stroke="none" stroke-width="1"/><line x1="120.00" y1="449.00" x2="480.00" y2="550.00" stroke="#007F73" stroke-width="4"/><ellipse cx="370.00" cy="457.00" rx="104.00" ry="52.00" fill="none" stroke="#6200EE" stroke-width="2"/><ellipse cx="370.00" cy="457.00" rx="68.00" ry="34.00" fill="none" stroke="#6200EE" stroke-width="2"/><circle cx="320.00" cy="505.00" r="7.00" fill="#6200EE" stroke="#FFFFFF" stroke-width="2"/><text x="136.00" y="539.00" font-size="15" fill="#007F73" text-anchor="start" font-weight="600">g(x) ≤ b</text><text x="336.00" y="520.00" font-size="14" fill="#202124" text-anchor="start" font-weight="400">binding boundary</text><text x="648.00" y="455.00" font-size="18" fill="#202124" text-anchor="start" font-weight="600">w_p</text><rect x="690.00" y="435.00" width="225.00" height="34.00" rx="4" fill="#EFE7FA" stroke="#6200EE" stroke-width="1"/><text x="802.00" y="458.00" font-size="14" fill="#202124" text-anchor="middle" font-weight="400">benchmark w_B</text><rect x="915.00" y="435.00" width="64.00" height="34.00" rx="4" fill="#E3F4F1" stroke="#007F73" stroke-width="1"/><text x="947.00" y="458.00" font-size="16" fill="#007F73" text-anchor="middle" font-weight="600">+</text><rect x="690.00" y="494.00" width="64.00" height="28.00" rx="4" fill="#FCE8EC" stroke="#B00020" stroke-width="1"/><text x="722.00" y="514.00" font-size="16" fill="#B00020" text-anchor="middle" font-weight="600">−</text><line x1="754.00" y1="508.00" x2="915.00" y2="452.00" stroke="#64666B" stroke-width="1.5" stroke-dasharray="5 4"/><text x="690.00" y="553.00" font-size="17" fill="#202124" text-anchor="start" font-weight="400">w_p = w_B + Delta w     and     1^T Delta w = 0</text><text x="44.00" y="658.00" font-size="14" fill="#64666B" text-anchor="start" font-weight="400">Conceptual geometry | No market observations</text></g></svg>
