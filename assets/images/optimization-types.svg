<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="optimization-types-title optimization-types-desc"><title id="optimization-types-title">Four ways to frame an optimization problem</title><desc id="optimization-types-desc">Three panels show minimization of elliptical objective contours over different feasible sets. Equality and binding inequality optima are exact tangencies. The fourth shows benchmark-relative weights as a reparameterization with zero-net active weights.</desc><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Roboto, Noto Sans Thai, Arial, sans-serif"><text x="44.00" y="48.00" font-size="28" fill="#202124" text-anchor="start" font-weight="600">Four ways to frame an optimization problem</text><text x="44.00" y="80.00" font-size="16" fill="#64666B" text-anchor="start" font-weight="400">Constraints define feasible choices; a benchmark defines active weights.</text><rect x="50.00" y="112.00" width="500.00" height="276.00" rx="8" fill="#FFFFFF" stroke="#E3E3E8" stroke-width="1"/><rect x="68.00" y="130.00" width="4.00" height="22.00" rx="2" fill="#6200EE" stroke="none" stroke-width="1"/><text x="84.00" y="147.00" font-size="18" fill="#202124" text-anchor="start" font-weight="600">1  Unconstrained</text><line x1="68.00" y1="164.00" x2="532.00" y2="164.00" stroke="#E3E3E8" stroke-width="1"/><rect x="570.00" y="112.00" width="500.00" height="276.00" rx="8" fill="#FFFFFF" stroke="#E3E3E8" stroke-width="1"/><rect x="588.00" y="130.00" width="4.00" height="22.00" rx="2" fill="#6200EE" stroke="none" stroke-width="1"/><text x="604.00" y="147.00" font-size="18" fill="#202124" text-anchor="start" font-weight="600">2  Equality constraint</text><line x1="588.00" y1="164.00" x2="1052.00" y2="164.00" stroke="#E3E3E8" stroke-width="1"/><rect x="50.00" y="412.00" width="500.00" height="276.00" rx="8" fill="#FFFFFF" stroke="#E3E3E8" stroke-width="1"/><rect x="68.00" y="430.00" width="4.00" height="22.00" rx="2" fill="#6200EE" stroke="none" stroke-width="1"/><text x="84.00" y="447.00" font-size="18" fill="#202124" text-anchor="start" font-weight="600">3  Inequality constraint</text><line x1="68.00" y1="464.00" x2="532.00" y2="464.00" stroke="#E3E3E8" stroke-width="1"/><rect x="570.00" y="412.00" width="500.00" height="276.00" rx="8" fill="#FFFFFF" stroke="#E3E3E8" stroke-width="1"/><rect x="588.00" y="430.00" width="4.00" height="22.00" rx="2" fill="#6200EE" stroke="none" stroke-width="1"/><text x="604.00" y="447.00" font-size="18" fill="#202124" text-anchor="start" font-weight="600">4  Benchmark-relative</text><line x1="588.00" y1="464.00" x2="1052.00" y2="464.00" stroke="#E3E3E8" stroke-width="1"/><ellipse cx="300.00" cy="259.00" rx="126.00" ry="45.60" fill="none" stroke="#6200EE" stroke-width="1.8"/><ellipse cx="300.00" cy="259.00" rx="89.25" ry="32.30" fill="none" stroke="#6200EE" stroke-width="1.8"/><ellipse cx="300.00" cy="259.00" rx="52.50" ry="19.00" fill="none" stroke="#6200EE" stroke-width="1.8"/><circle cx="300.00" cy="259.00" r="6.00" fill="#6200EE" stroke="#FFFFFF" stroke-width="2"/><text x="316.00" y="265.00" font-size="16" fill="#6200EE" text-anchor="start" font-weight="600">x*</text><text x="300.00" y="351.00" font-size="16" fill="#64666B" text-anchor="middle" font-weight="400">Search over all x</text><ellipse cx="805.00" cy="232.00" rx="141.75" ry="51.30" fill="none" stroke="#64666B" stroke-width="1.2"/><ellipse cx="805.00" cy="232.00" rx="105.00" ry="38.00" fill="none" stroke="#6200EE" stroke-width="1.8"/><ellipse cx="805.00" cy="232.00" rx="63.00" ry="22.80" fill="none" stroke="#64666B" stroke-width="1.2"/><circle cx="805.00" cy="232.00" r="3.00" fill="#64666B" stroke="#FFFFFF" stroke-width="1"/><line x1="642.00" y1="312.33" x2="998.00" y2="234.01" stroke="#007F73" stroke-width="3"/><circle cx="859.54" cy="264.47" r="6.50" fill="#6200EE" stroke="#FFFFFF" stroke-width="2"/><polyline points="859.54,274.47 859.54,325.00 887.54,325.00" fill="none" stroke="#64666B" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="887.54" y="330.00" font-size="15" fill="#6200EE" text-anchor="start" font-weight="600">x*</text><text x="820.00" y="361.00" font-size="15" fill="#007F73" text-anchor="middle" font-weight="500">g(x) = b  ·  Feasible choices lie on the line</text><polygon points="122.00,540.61 478.00,618.93 478.00,630.00 122.00,630.00" fill="#E3F4F1" stroke="none" stroke-width="1"/><ellipse cx="285.00" cy="532.00" rx="141.75" ry="51.30" fill="none" stroke="#64666B" stroke-width="1.2"/><ellipse cx="285.00" cy="532.00" rx="105.00" ry="38.00" fill="none" stroke="#6200EE" stroke-width="1.8"/><ellipse cx="285.00" cy="532.00" rx="63.00" ry="22.80" fill="none" stroke="#64666B" stroke-width="1.2"/><circle cx="285.00" cy="532.00" r="3.00" fill="#64666B" stroke="#FFFFFF" stroke-width="1"/><line x1="122.00" y1="540.61" x2="478.00" y2="618.93" stroke="#007F73" stroke-width="3"/><circle cx="230.46" cy="564.47" r="6.50" fill="#6200EE" stroke="#FFFFFF" stroke-width="2"/><polyline points="230.46,574.47 230.46,625.00 202.46,625.00" fill="none" stroke="#64666B" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="202.46" y="630.00" font-size="15" fill="#6200EE" text-anchor="end" font-weight="600">binding x*</text><text x="300.00" y="661.00" font-size="15" fill="#007F73" text-anchor="middle" font-weight="500">g(x) ≤ b  ·  Shaded side is feasible</text><text x="820" y="504" text-anchor="middle" font-size="25" fill="#202124" font-weight="500">w<tspan baseline-shift="sub" font-size="16">p</tspan><tspan> = w</tspan><tspan baseline-shift="sub" font-size="16">B</tspan><tspan> + Δw</tspan></text><text x="820.00" y="531.00" font-size="14" fill="#64666B" text-anchor="middle" font-weight="400">portfolio = benchmark + active weights</text><rect x="644.00" y="553.00" width="160.00" height="40.00" rx="5" fill="#E3F4F1" stroke="#007F73" stroke-width="1"/><text x="724.00" y="579.00" font-size="15" fill="#007F73" text-anchor="middle" font-weight="500">+ overweight</text><rect x="836.00" y="553.00" width="160.00" height="40.00" rx="5" fill="#FCE8EC" stroke="#B00020" stroke-width="1"/><text x="916.00" y="579.00" font-size="15" fill="#B00020" text-anchor="middle" font-weight="500">− underweight</text><text x="820.00" y="625.00" font-size="22" fill="#202124" text-anchor="middle" font-weight="500">Σᵢ Δwᵢ = 0</text><text x="820.00" y="661.00" font-size="15" fill="#64666B" text-anchor="middle" font-weight="400">Same total weight; active tilts net to zero</text><text x="44.00" y="738.00" font-size="14" fill="#64666B" text-anchor="start" font-weight="400">Illustrative convex objective · Lower contours are better · No market observations</text></g></svg>
