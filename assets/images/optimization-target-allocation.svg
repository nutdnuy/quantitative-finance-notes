<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="optimization-target-allocation-title optimization-target-allocation-desc"><title id="optimization-target-allocation-title">A 10% target return determines one minimum-variance allocation</title><desc id="optimization-target-allocation-desc">Horizontal bars show the four optimal weights for the unconstrained minimum-variance portfolio with expected return fixed at ten percent.</desc><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Roboto, Noto Sans Thai, Arial, sans-serif"><text x="44.00" y="48.00" font-size="28" fill="#202124" text-anchor="start" font-weight="600">A 10% target return determines one minimum-variance allocation</text><text x="44.00" y="80.00" font-size="16" fill="#64666B" text-anchor="start" font-weight="400">All four weights are positive for this target, although short selling is allowed by the model.</text><line x1="290.00" y1="146.00" x2="290.00" y2="532.00" stroke="#64666B" stroke-width="1.5"/><text x="92.00" y="200.00" font-size="21" fill="#202124" text-anchor="start" font-weight="600">X1</text><text x="147.00" y="200.00" font-size="15" fill="#64666B" text-anchor="start" font-weight="400">μ 5%  ·  σ 7%</text><rect x="290.00" y="175.00" width="660.00" height="38.00" rx="4" fill="#F4F4F6" stroke="none" stroke-width="1"/><rect x="290.00" y="175.00" width="581.25" height="38.00" rx="4" fill="#6200EE" stroke="none" stroke-width="1"/><text x="883.25" y="201.00" font-size="17" fill="#202124" text-anchor="start" font-weight="600">52.84%</text><text x="92.00" y="286.00" font-size="21" fill="#202124" text-anchor="start" font-weight="600">X2</text><text x="147.00" y="286.00" font-size="15" fill="#64666B" text-anchor="start" font-weight="400">μ 7%  ·  σ 12%</text><rect x="290.00" y="261.00" width="660.00" height="38.00" rx="4" fill="#F4F4F6" stroke="none" stroke-width="1"/><rect x="290.00" y="261.00" width="190.18" height="38.00" rx="4" fill="#007F73" stroke="none" stroke-width="1"/><text x="492.18" y="287.00" font-size="17" fill="#202124" text-anchor="start" font-weight="600">17.29%</text><text x="92.00" y="372.00" font-size="21" fill="#202124" text-anchor="start" font-weight="600">X3</text><text x="147.00" y="372.00" font-size="15" fill="#64666B" text-anchor="start" font-weight="400">μ 15%  ·  σ 30%</text><rect x="290.00" y="347.00" width="660.00" height="38.00" rx="4" fill="#F4F4F6" stroke="none" stroke-width="1"/><rect x="290.00" y="347.00" width="175.74" height="38.00" rx="4" fill="#6200EE" stroke="none" stroke-width="1"/><text x="477.74" y="373.00" font-size="17" fill="#202124" text-anchor="start" font-weight="600">15.98%</text><text x="92.00" y="458.00" font-size="21" fill="#202124" text-anchor="start" font-weight="600">X4</text><text x="147.00" y="458.00" font-size="15" fill="#64666B" text-anchor="start" font-weight="400">μ 27%  ·  σ 60%</text><rect x="290.00" y="433.00" width="660.00" height="38.00" rx="4" fill="#F4F4F6" stroke="none" stroke-width="1"/><rect x="290.00" y="433.00" width="152.83" height="38.00" rx="4" fill="#007F73" stroke="none" stroke-width="1"/><text x="454.83" y="459.00" font-size="17" fill="#202124" text-anchor="start" font-weight="600">13.89%</text><rect x="92.00" y="556.00" width="956.00" height="58.00" rx="6" fill="#EFE7FA" stroke="none" stroke-width="1"/><text x="112.00" y="592.00" font-size="18" fill="#202124" text-anchor="start" font-weight="500">sum(w) = 1.0000     mu^T w = 10.00%     portfolio SD = 16.13%</text><text x="44.00" y="658.00" font-size="14" fill="#64666B" text-anchor="start" font-weight="400">Hypothetical annual inputs | Target portfolio return = 10% | Weights calculated from Sigma inverse</text></g></svg>
