<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="optimization-active-title optimization-active-desc"><title id="optimization-active-title">A 130–30 portfolio is a 100% benchmark plus a zero-net active overlay</title><desc id="optimization-active-desc">A three-step bar decomposition shows a fully invested benchmark, an active long thirty percent and short thirty percent overlay, and the combined portfolio with one hundred thirty percent long and thirty percent short exposure.</desc><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Roboto, Noto Sans Thai, Arial, sans-serif"><text x="44.00" y="48.00" font-size="28" fill="#202124" text-anchor="start" font-weight="600">A 130–30 portfolio is a 100% benchmark plus a zero-net active overlay</text><text x="44.00" y="80.00" font-size="16" fill="#64666B" text-anchor="start" font-weight="400">The active weights sum to zero, so the combined portfolio keeps net exposure at one hundred percent.</text><defs><marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#202124"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6200EE"/></marker></defs><rect x="72.00" y="132.00" width="286.00" height="410.00" rx="8" fill="#FFFFFF" stroke="#E3E3E8" stroke-width="1"/><text x="92.00" y="170.00" font-size="20" fill="#202124" text-anchor="start" font-weight="600">Benchmark</text><text x="92.00" y="197.00" font-size="14" fill="#64666B" text-anchor="start" font-weight="400">100% net</text><rect x="405.00" y="132.00" width="286.00" height="410.00" rx="8" fill="#FFFFFF" stroke="#E3E3E8" stroke-width="1"/><text x="425.00" y="170.00" font-size="20" fill="#202124" text-anchor="start" font-weight="600">Active overlay</text><text x="425.00" y="197.00" font-size="14" fill="#64666B" text-anchor="start" font-weight="400">0% net</text><rect x="738.00" y="132.00" width="286.00" height="410.00" rx="8" fill="#FFFFFF" stroke="#E3E3E8" stroke-width="1"/><text x="758.00" y="170.00" font-size="20" fill="#202124" text-anchor="start" font-weight="600">Combined</text><text x="758.00" y="197.00" font-size="14" fill="#64666B" text-anchor="start" font-weight="400">100% net</text><rect x="132.00" y="260.00" width="166.00" height="132.00" rx="5" fill="#EFE7FA" stroke="#6200EE" stroke-width="2"/><text x="215.00" y="322.00" font-size="26" fill="#6200EE" text-anchor="middle" font-weight="600">+100%</text><text x="215.00" y="352.00" font-size="15" fill="#6200EE" text-anchor="middle" font-weight="400">benchmark</text><rect x="465.00" y="225.00" width="166.00" height="82.00" rx="5" fill="#E3F4F1" stroke="#007F73" stroke-width="2"/><text x="548.00" y="274.00" font-size="20" fill="#007F73" text-anchor="middle" font-weight="600">+30% long</text><rect x="465.00" y="352.00" width="166.00" height="82.00" rx="5" fill="#FCE8EC" stroke="#B00020" stroke-width="2"/><text x="548.00" y="401.00" font-size="20" fill="#B00020" text-anchor="middle" font-weight="600">−30% short</text><text x="548.00" y="477.00" font-size="18" fill="#202124" text-anchor="middle" font-weight="600">sum(Delta w) = 0</text><rect x="798.00" y="200.00" width="166.00" height="172.00" rx="5" fill="#E3F4F1" stroke="#007F73" stroke-width="2"/><text x="881.00" y="279.00" font-size="27" fill="#007F73" text-anchor="middle" font-weight="600">+130%</text><text x="881.00" y="310.00" font-size="15" fill="#007F73" text-anchor="middle" font-weight="400">gross long</text><rect x="798.00" y="395.00" width="166.00" height="68.00" rx="5" fill="#FCE8EC" stroke="#B00020" stroke-width="2"/><text x="881.00" y="437.00" font-size="20" fill="#B00020" text-anchor="middle" font-weight="600">−30% short</text><line x1="360.00" y1="336.00" x2="393.00" y2="336.00" stroke="#202124" stroke-width="2.5" marker-end="url(#arrow-ink)"/><line x1="693.00" y1="336.00" x2="726.00" y2="336.00" stroke="#202124" stroke-width="2.5" marker-end="url(#arrow-ink)"/><text x="548.00" y="585.00" font-size="18" fill="#202124" text-anchor="middle" font-weight="500">w_p = w_B + Delta w     ·     gross exposure = 160%     ·     net exposure = 100%</text><text x="44.00" y="658.00" font-size="14" fill="#64666B" text-anchor="start" font-weight="400">Conceptual 130–30 exposure | Illustrative only | No market observations</text></g></svg>
