<title id="title">GJR allows equal-size shocks to have different effects</title><desc id="desc">Hypothetical news impact curves with omega 0.000005 and current variance 0.0001. GARCH gives variance 0.000164 at shocks plus or minus 0.03. GJR gives variance 0.000209 at minus 0.03 and 0.000119 at plus 0.03. Both persistences are 0.95 only under symmetric unit-variance shocks.</desc>
<rect width="1000" height="570" fill="white"/>
