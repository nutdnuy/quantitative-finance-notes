<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="optimization-black-litterman-beliefs-title optimization-black-litterman-beliefs-desc"><title id="optimization-black-litterman-beliefs-title">Black–Litterman moves equilibrium beliefs toward stated views</title><desc id="optimization-black-litterman-beliefs-desc">Grouped bars compare the reverse-optimized prior excess returns and Black-Litterman posterior excess returns for four hypothetical assets.</desc><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Roboto, Noto Sans Thai, Arial, sans-serif"><text x="44.00" y="48.00" font-size="28" fill="#202124" text-anchor="start" font-weight="600">Black–Litterman moves equilibrium beliefs toward stated views</text><text x="44.00" y="80.00" font-size="16" fill="#64666B" text-anchor="start" font-weight="400">The posterior reflects both the views and their uncertainty; it does not simply replace the prior.</text><line x1="267.00" y1="132.00" x2="267.00" y2="542.00" stroke="#E3E3E8" stroke-width="1"/><text x="267.00" y="566.00" font-size="14" fill="#64666B" text-anchor="middle" font-weight="400">X1</text><line x1="429.00" y1="132.00" x2="429.00" y2="542.00" stroke="#E3E3E8" stroke-width="1"/><text x="429.00" y="566.00" font-size="14" fill="#64666B" text-anchor="middle" font-weight="400">X2</text><line x1="591.00" y1="132.00" x2="591.00" y2="542.00" stroke="#E3E3E8" stroke-width="1"/><text x="591.00" y="566.00" font-size="14" fill="#64666B" text-anchor="middle" font-weight="400">X3</text><line x1="753.00" y1="132.00" x2="753.00" y2="542.00" stroke="#E3E3E8" stroke-width="1"/><text x="753.00" y="566.00" font-size="14" fill="#64666B" text-anchor="middle" font-weight="400">X4</text><line x1="105.00" y1="542.00" x2="915.00" y2="542.00" stroke="#E3E3E8" stroke-width="1"/><text x="95.00" y="547.00" font-size="14" fill="#64666B" text-anchor="end" font-weight="400">0</text><line x1="105.00" y1="473.67" x2="91