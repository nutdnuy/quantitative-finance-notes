<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
<title id="title">GARCH updates variance one observation at a time</title><desc id="desc">Calculated hypothetical GARCH update with omega 0.000005, alpha 0.08, beta 0.87, current variance 0.0001 and shock minus 0.03. Contributions 0.05, 0.72, 0.87 percentage-point squared sum to 1.64. Next daily standard deviation is 1.2806 percent.</desc>
<rect width="1000" height="570" fill="white"/>
<g font-family="Roboto, Arial, sans-serif"><text x="40" y="48" font-size="28" fill="#232326" text-anchor="start">GARCH updates variance one observation at a time</text><text x="40" y="82" font-size="18" fill="#64646b" text-anchor="start">Hypothetical daily inputs: current SD = 1%, shock = −3%</text><text x="85" y="116" font-size="17" fill="#64646b" text-anchor="start">Variance (percentage-point squared, %²)</text><line x1="90" y1="401" x2="930" y2="401" stroke="#dddddf" stroke-width="2" stroke-dasharray=""/><text x="76" y="407" font-size="16" fill="#64646b" text-anchor="end">0.0</text><line x1="90" y1="327.0" x2="930" y2="327.0" stroke="#dddddf" stroke-width="2" stroke-dasharray=""/><text x="76" y="333.0" font-size="16" fill="#64646b" text-anchor="end">0.5</text><line x1="90" y1="253" x2="930" y2="253" stroke="#dddddf" stroke-width="2" stroke-dasharray=""/><text x="76" y="259" font-size="16" fill="#64646b" text-anchor="end">1.0</text><line x1="90" y1="179.0" x2="930" y2="179.0" stroke="#dddddf" stroke-width="2" stroke-dasharray=""/><text x="76" y="185.0" font-size="16" fill="#64646b" text-anchor="end">1.5</text><rect x="136" y="393.600" width="118" height="7.400" fill="#64646b"/><text x="195" y="380.6" font-size="23" fill="#64646b" text-anchor="middle">0.05</text><text x="195" y="433" font-size="17" fill="#64646b" text-anchor="middle">Intercept</text><text x="195" y="459" font-size="19" fill="#64646b" text-anchor="middle">ω</text><rect x="341" y="294.440" width="118" height="106.560" fill="#6200ee"/><text x="400" y="281.44" font-size="23" fill="#6200ee" text-anchor="middle">0.72</text><text x="400" y="433" font-size="17" fill="#64646b" text-anchor="middle">New shock</text><text x="400" y="459" font-size="19" fill="#6200ee" text-anchor="middle">αe²</text><rect x="546" y="272.240" width="118" height="128.760" fill="#008577"/><text x="605" y="259.24" font-size="23" fill="#008577" text-anchor="middle">0.87</text><text x="605" y="433" font-size="17" fill="#64646b" text-anchor="middle">Previous variance</text><text x="605" y="459" font-size="19" fill="#008577" text-anchor="middle">βh</text><rect x="761" y="158.280" width="118" height="242.720" fill="#3700b3"/><text x="820" y="145.27999999999997" font-size="23" fill="#3700b3" text-anchor="middle">1.64</text><text x="820" y="433" font-size="17" fill="#64646b" text-anchor="middle">Next variance</text><text x="820" y="459" font-size="19" fill="#3700b3" text-anchor="middle">h(next)</text><text x="90" y="508" font-size="22" fill="#232326" text-anchor="start">0.05 + 0.72 + 0.87 = 1.64 %²</text><text x="930" y="508" font-size="21" fill="#6200ee" text-anchor="end">Next daily SD = √1.64 = 1.2806%</text><text x="90" y="544" font-size="17" fill="#64646b" text-anchor="start">Variance contributions add; standard deviations do not.</text></g></svg>