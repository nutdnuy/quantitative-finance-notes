<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc"><title id="title">CAPM links expected return to beta</title><desc id="desc">The security market line is expected return equals 2% plus beta times 6%. A beta of 1.2 implies 9.2%. The horizontal axis is beta, not total volatility.</desc><rect width="1120" height="680" fill="white"/><g font-family="Roboto,Arial,sans-serif" fill="#202124"><text x="44.00" y="47.00" font-size="28" fill="#202124" text-anchor="start" font-weight="600">CAPM links expected return to beta</text><text x="44.00" y="80.00" font-size="17" fill="#64666B" text-anchor="start" font-weight="400">Risk-free return = 2% | Market expected return = 8% | Market premium = 6%</text><path d="M100.000,552.000 L100.000,148.000" fill="none" stroke="#e7e7eb" stroke-width="1" stroke-dasharray=""/><text x="100.00" y="583.00" font-size="16" fill="#202124" text-anchor="middle" font-weight="400">0</text><path d="M332.500,552.000 L332.500,148.000" fill="none" stroke="#e7e7eb" stroke-width="1" stroke-dasharray=""/><text x="332.50" y="583.00" font-size="16" fill="#202124" text-anchor="middle" font-weight="400">0.5</text><path d="M565.000,552.000 L565.000,148.000" fill="none" stroke="#e7e7eb" stroke-width="1" stroke-dasharray=""/><text x="565.00" y="583.00" font-size="16" fill="#202124" text-anchor="middle" font-weight="400">1</text><path d="M797.500,552.000 L797.500,148.000" fill="none" stroke="#e7e7eb" stroke-width="1" stroke-dasharray=""/><text x="797.50" y="583.00" font-size="16" fill="#202124" text-anchor="middle" font-weight="400">1.5</text><path d="M1030.000,552.000 L1030.000,148.000" fill="none" stroke="#e7e7eb" stroke-width="1" stroke-dasharray=""/><text x="1030.00" y="583.00" font-size="16" fill="#202124" text-anchor="middle" font-weight="400">2</text><path d="M100.000,552.000 L1030.000,552.000" fill="none" stroke="#e7e7eb" stroke-width="1" stroke-dasharray=""/><text x="80.00" y="557.00" font-size="16" fill="#202124" text-anchor="end" font-weight="400">0</text><path d="M100.000,501.500 L1030.000,501.500" fill="none" stroke="#e7e7eb" stroke-width="1" stroke-dasharray=""/><text x="80.00" y="506.50" font-size="16" fill="#202124" text-anchor="end" font-weight="400">2</text><path d="M100.000,451.000 L1030.000,451.000" fill="none" stroke="#e7e7eb" stroke-width="1" stroke-dasharray=""/><text x="80.00" y="456.00" font-size="16" fill="#202124" text-anchor="end" font-weight="400">4</text><path d="M100.000,400.500 L1030.000,400.500" fill="none" stroke="#e7e7eb" stroke-width="1" stroke-dasharray=""/><text x="80.00" y="405.50" font-size="16" fill="#202124" text-anchor="end" font-weight="400">6</text><path d="M100.000,350.000 L1030.000,350.000" fill="none" stroke="#e7e7eb" stroke-width="1" stroke-dasharray=""/><text x="80.00" y="355.00" font-size="16" fill="#202124" text-anchor="end" font-weight="400">8</text><path d="M100.000,299.500 L1030.000,299.500" fill="none" stroke="#e7e7eb" stroke-width="1" stroke-dasharray=""/><text x="80.00" y="304.50" font-size="16" fill="#202124" text-anchor="end" font-weight="400">10</text><path d="M100.000,249.000 L1030.000,249.000" fill="none" stroke="#e7e7eb" stroke-width="1" stroke-dasharray=""/><text x="80.00" y="254.00" font-size="16" fill="#202124" text-anchor="end" font-weight="400">12</text><path d="M100.000,198.500 L1030.000,198.500" fill="none" stroke="#e7e7eb" stroke-width="1" stroke-dasharray=""/><text x="80.00" y="203.50" font-size="16" fill="#202124" text-anchor="end" font-weight="400">14</text><path d="M100.000,148.000 L1030.000,148.000" fill="none" stroke="#e7e7eb" stroke-width="1" stroke-dasharray=""/><text x="80.00" y="153.00" font-size="16" fill="#202124" text-anchor="end" font-weight="400">16</text><path d="M100.000,552.000 L1030.000,552.000" fill="none" stroke="#9a9ba2" stroke-width="1.5" stroke-dasharray=""/><path d="M100.000,552.000 L100.000,148.000" fill="none" stroke="#9a9ba2" stroke-width="1.5" stroke-dasharray=""/><text x="558.00" y="617.00" font-size="18" fill="#202124" text-anchor="middle" font-weight="400">Beta to the market (unitless)</text><text x="96.00" y="120.00" font-size="18" fill="#202124" text-anchor="start" font-weight="400">Expected return (%)</text><text x="44.00" y="658.00" font-size="15" fill="#64666B" text-anchor="start" font-weight="400">Hypothetical inputs | 1-year simple total returns | No market observations</text><path d="M100.000,501.500 L1030.000,198.500" fill="none" stroke="#6200EE" stroke-width="3.5" stroke-dasharray=""/><path d="M658.000,552.000 L658.000,319.700" fill="none" stroke="#64666B" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M100.000,319.700 L658.000,319.700" fill="none" stroke="#64666B" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="100.000" cy="501.500" r="6" fill="#202124" stroke="white" stroke-width="2"/><text x="113.00" y="469.50" font-size="17" fill="#202124" text-anchor="start" font-weight="500">Risk-free</text><circle cx="565.000" cy="350.000" r="6" fill="#6200EE" stroke="white" stroke-width="2"/><text x="577.00" y="402.00" font-size="17" fill="#6200EE" text-anchor="start" font-weight="500">Market: beta 1</text><circle cx="658.000" cy="319.700" r="6" fill="#007F73" stroke="white" stroke-width="2"/><text x="674.00" y="344.70" font-size="17" fill="#007F73" text-anchor="start" font-weight="500">Beta 1.2: expected 9.2%</text><text x="153.00" y="188.00" font-size="20" fill="#6200EE" text-anchor="start" font-weight="400">SML: 2% + beta × 6%</text><text x="153.00" y="215.00" font-size="17" fill="#64666B" text-anchor="start" font-weight="400">Total volatility is not on this axis.</text></g></svg>