<line x1="300" y1="174.0" x2="420" y2="174.0" stroke="#202124" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="285" y="134" width="150" height="32" rx="5" fill="#ffffff" stroke="#E3E3E8"/>
<text x="360.0" y="158.0" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="18" fill="#64666B">equilibrium</text>
