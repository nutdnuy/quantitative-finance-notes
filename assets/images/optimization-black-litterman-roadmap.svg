<text x="700.0" y="158.0" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="18" fill="#64666B">implied returns</text>
<line x1="980" y1="174.0" x2="1100" y2="174.0" stroke="#202124" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="965" y="134" width="150" height="32" rx="5" fill="#ffffff" stroke="#E3E3E8"/>
<text x="1040.0" y="158.0" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="18" fill="#64666B">combine</text>
<line x1="1320" y1="174.0" x2="1440" y2="174.0" stroke="#202124" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="1305" y="134" width="150" height="32" rx="5" fill="#ffffff" stroke="#E3E3E8"/>
<text x="1380.0" y="158.0" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="18" fill="#64666B">optimize</text>
<rect x="80" y="130" width="220" height="88" rx="12" fill="#EFE7FA" stroke="#6200EE" stroke-width="2.5"/>
