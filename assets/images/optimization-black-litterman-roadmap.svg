<rect x="420" y="130" width="220" height="88" rx="12" fill="#F4F4F6" stroke="#202124" stroke-width="2.5"/>
<text x="530.0" y="170.0" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="600" fill="#202124">Reverse</text>
<text x="530.0" y="192.0" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="600" fill="#202124">optimization</text>
<rect x="760" y="130" width="220" height="88" rx="12" fill="#F4F4F6" stroke="#202124" stroke-width="2.5"/>
<text x="870.0" y="170.0" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="600" fill="#202124">Prior Π, τΣ +</text>
