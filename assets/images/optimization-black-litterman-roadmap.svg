<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="380" viewBox="0 0 1740 380" role="img" aria-labelledby="optimization-black-litterman-roadmap-title optimization-black-litterman-roadmap-desc">
<title id="optimization-black-litterman-roadmap-title">Black–Litterman in five stages</title>
<desc id="optimization-black-litterman-roadmap-desc">Market weights pass through reverse optimization to form a prior, which is combined with views and their uncertainty to produce posterior expected excess returns and a final allocation.</desc>
