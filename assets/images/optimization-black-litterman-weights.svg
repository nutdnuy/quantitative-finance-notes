<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="optimization-black-litterman-weights-title optimization-black-litterman-weights-desc"><title id="optimization-black-litterman-weights-title">Views change both risky allocations and the risk-free share</title><desc id="optimization-black-litterman-weights-desc">Paired horizontal bars compare market weights with Black-Litterman allocation weights at risk aversion lambda two point two four, including the residual risk-free allocation.</desc><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Roboto, Noto Sans Thai, Arial, sans-serif"><text x="44.00" y="48.00" font-size="28" fill="#202124" text-anchor="start" font-weight="600">Views change both risky allocations and the risk-free share</text><text x="44.00" y="80.00" font-size="16" fill="#64666B" text-anchor="start" font-weight="400">The posterior allocation is not the market portfolio because the two stated views alter expected excess returns.</text><line x1="290.00" y1="140.00" x2="290.00" y2="568.00" stroke="#64666B" stroke-width="1.5"/><line x1="290.00" y1="140.00" x2="290.00" y2="568.00" stroke="#E3E3E8" stroke-width="1"/><text x="290.00" y="592.00" font-size="13" fill="#64666B" text-anchor="middle" font-weight="400">0%</text><line x1="425.00" y1="140.00" x2="425.00" y2="568.00" stroke="#E3E3E8" stroke-width="1"/><text x="425.00" y="592.00" font-size="13" fill="#64666B" text-anchor="middle" font-weight="400">10%</text><line x1="560.00" y1="140.00" x2="560.00" y2="568.00" stroke="#E3E3E8" stroke-width="1"/><text x="560.00" y="592.00" font-size="13" fill="#64666B" text-anchor="middle" font-weight="400">20%</text><line x1="695.00" y1="140.00" x2="695.00" y2="568.00" stroke="#E3E3E8" stroke-width="1"/><text x="695.00" y="592.00" font-size="13" fill="#64666B" text-anchor="middle" font-weight="400">30%</text><line x1="830.00" y1="140.00" x2="830.00" y2="568.00" stroke="#E3E3E8" stroke-width="1