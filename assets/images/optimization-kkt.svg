<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="optimization-kkt-title optimization-kkt-desc"><title id="optimization-kkt-title">A long-only constraint moves the 20% target portfolio to the boundary</title><desc id="optimization-kkt-desc">Diverging bars compare unconstrained and long-only minimum-variance weights for a twenty percent target return. Asset X1 is negative without the constraint and exactly zero when the long-only constraint binds.</desc><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Roboto, Noto Sans Thai, Arial, sans-serif"><text x="44.00" y="48.00" font-size="28" fill="#202124" text-anchor="start" font-weight="600">A long-only constraint moves the 20% target portfolio to the boundary</text><text x="44.00" y="80.00" font-size="16" fill="#64666B" text-anchor="start" font-weight="400">KKT identifies the active boundary: w₁ = 0 while the remaining weights satisfy the return and budget constraints.</text><line x1="223.92" y1="148.00" x2="223.92" y2="508.00" stroke="#E3E3E8" stroke-width="1.5"/><text x="223.92" y="536.00" font-size="13" fill="#64666B" text-anchor="middle" font-weight="400">-75%</text><line x1="321.22" y1="148.00" x2="321.22" y2="508.00" stroke="#E3E3E8" stroke-width="1.5"/><text x="321.22" y="536.00" font-size="13" fill="#64666B" text-anchor="middle" font-weight="400">-50%</text><line x1="418.51" y1="148.00" x2="418.51" y2="508.00" stroke="#E3E3E8" stroke-width="1.5"/><text x="418.51" y="536.00" font-size="13" fill="#64666B" text-anchor="middle" font-weight="400">-25%</text><line x1="515.81" y1="148.00" x2="515.81" y2="508.00" stroke="#202124" stroke-width="2"/><text x="515.81" y="536.00" font-size="13" fill="#64666B" text-anchor="middle" font-weight="400">0%</text><line x1="613.11" y1="148.00" x2="613.11" y2="508.00" stroke="#E3E3E8" stroke-width="1.5"/><text x="613.11" y="536.00" font-size="13" fill="#64666B" text-anchor="middle" font-weight="400">25%</text><line x1="710.41" y1="148.00" x2="710.41" y2="508.00" stroke="#E3E3E8" stroke-width="1.5"/><text x="710.41" y="536.00" font-size="13" fill="#64666B" text-anchor="middle" font-weight="400">50%</text><line x1="807.70" y1="148.00" x2="807.70" y2="508.00" stroke="#E3E3E8" stroke-width="1.5"/><text x="807.70" y="536.00" font-size="13" fill="#64666B" text-anchor="middle" font-weight="400">75%</text><line x1="905.00" y1="148.00" x2="905.00" y2="508.00" stroke="#E3E3E8" stroke-width="1.5"/><text x="905.00" y="536.00" font-size="13" fill="#64666B" text-anchor="middle" font-weight="400">100%</text><text x="92.00" y="200.00" font-size="19" fill="#202124" text-anchor="start" font-weight="600">X1</text><rect x="235.75" y="174.00" width="280.06" height="17.00" rx="3" fill="#6200EE" stroke="none" stroke-width="1"/><rect x="515.81" y="201.00" width="0.00" height="17.00" rx="3" fill="#007F73" stroke="none" stroke-width="1"/><text x="227.75" y="188.00" font-size="13" fill="#6200EE" text-anchor="end" font-weight="600">-72.0%</text><circle cx="515.81" cy="209.00" r="5.00" fill="#007F73" stroke="#FFFFFF" stroke-width="2"/><text x="525.81" y="215.00" font-size="13" fill="#007F73" text-anchor="start" font-weight="600">0%  binding</text><text x="92.00" y="282.00" font-size="19" fill="#202124" text-anchor="start" font-weight="600">X2</text><rect x="515.81" y="256.00" width="350.98" height="17.00" rx="3" fill="#6200EE" stroke="none" stroke-width="1"/><rect x="515.81" y="283.00" width="10.24" height="17.00" rx="3" fill="#007F73" stroke="none" stroke-width="1"/><text x="874.79" y="270.00" font-size="13" fill="#6200EE" text-anchor="start" font-weight="600">90.2%</text><text x="534.05" y="297.00" font-size="13" fill="#007F73" text-anchor="start" font-weight="600">2.6%</text><text x="92.00" y="364.00" font-size="19" fill="#202124" text-anchor="start" font-weight="600">X3</text><rect x="515.81" y="338.00" width="155.50" height="17.00" rx="3" fill="#6200EE" stroke="none" stroke-width="1"/><rect x="515.81" y="365.00" width="209.96" height="17.00" rx="3" fill="#007F73" stroke="none" stroke-width="1"/><text x="679.31" y="352.00" font-size="13" fill="#6200EE" text-anchor="start" font-weight="600">40.0%</text><text x="733.77" y="379.00" font-size="13" fill="#007F73" text-anchor="start" font-weight="600">53.9%</text><text x="92.00" y="446.00" font-size="19" fill="#202124" text-anchor="start" font-weight="600">X4</text><rect x="515.81" y="420.00" width="162.77" height="17.00" rx="3" fill="#6200EE" stroke="none" stroke-width="1"/><rect x="515.81" y="447.00" width="168.99" height="17.00" rx="3" fill="#007F73" stroke="none" stroke-width="1"/><text x="686.58" y="434.00" font-size="13" fill="#6200EE" text-anchor="start" font-weight="600">41.8%</text><text x="692.80" y="461.00" font-size="13" fill="#007F73" text-anchor="start" font-weight="600">43.4%</text><rect x="936.00" y="166.00" width="18.00" height="18.00" rx="0" fill="#6200EE" stroke="none" stroke-width="1"/><text x="966.00" y="181.00" font-size="14" fill="#6200EE" text-anchor="start" font-weight="600">Unconstrained</text><rect x="936.00" y="208.00" width="18.00" height="18.00" rx="0" fill="#007F73" stroke="none" stroke-width="1"/><text x="966.00" y="223.00" font-size="14" fill="#007F73" text-anchor="start" font-weight="600">Long-only</text><rect x="936.00" y="286.00" width="142.00" height="112.00" rx="6" fill="#E3F4F1" stroke="none" stroke-width="1"/><text x="954.00" y="317.00" font-size="14" fill="#64666B" text-anchor="start" font-weight="400">Active constraint</text><text x="954.00" y="351.00" font-size="22" fill="#007F73" text-anchor="start" font-weight="600">w₁ = 0</text><text x="954.00" y="380.00" font-size="13" fill="#64666B" text-anchor="start" font-weight="400">multiplier ≥ 0</text><text x="44.00" y="658.00" font-size="14" fill="#64666B" text-anchor="start" font-weight="400">Hypothetical annual inputs | Target portfolio return = 20% | Long-only active set X2-X4</text></g></svg>
