<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390" role="img" aria-labelledby="title desc"><title id="title">ต้นไม้ราคาหุ้นและ payoff ของ Call</title><desc id="desc">หุ้นวันนี้ 100 ดอลลาร์ ขึ้นเป็น 150 ด้วย p 0.6 ได้ payoff 50 หรือลงเป็น 50 ด้วย p 0.4 ได้ payoff 0 สำหรับ risk-neutral ใช้ q 0.5 ทั้งสองกิ่ง เมื่อดอกเบี้ยศูนย์และราคาใช้สิทธิ 100 ราคา Call วันนี้เท่ากับ 25</desc><rect width="820" height="390" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#555" stroke-width="1.5"/></marker></defs><text x="30" y="47" font-family="Noto Sans Thai,Arial,sans-serif" font-size="22" fill="#555555">วันนี้</text><text x="535" y="47" font-family="Noto Sans Thai,Arial,sans-serif" font-size="22" fill="#555555">ครบ 1 ปี</text><text x="30" y="198" font-family="Noto Sans Thai,Arial,sans-serif" font-size="34" fill="#6200ee">หุ้น 100</text><text x="30" y="237" font-family="Noto Sans Thai,Arial,sans-serif" font-size="26" fill="#00796b">Call = 25</text><polyline points="205.0,197.0 505.0,115.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><polyline points="205.0,197.0 505.0,295.0" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/><text x="285" y="83" font-family="Noto Sans Thai,Arial,sans-serif" font-size="24" fill="#242424">p = 0.6</text><text x="285" y="113" font-family="Noto Sans Thai,Arial,sans-serif" font-size="22" fill="#00796b">q = 0.5</text><text x="285" y="290" font-family="Noto Sans Thai,Arial,sans-serif" font-size="24" fill="#242424">p = 0.4</text><text x="285" y="320" font-family="Noto Sans Thai,Arial,sans-serif" font-size="22" fill="#00796b">q = 0.5</text><text x="535" y="117" font-family="Noto Sans Thai,Arial,sans-serif" font-size="34" fill="#6200ee">หุ้น 150</text><text x="535" y="157" font-family="Noto Sans Thai,Arial,sans-serif" font-size="26" fill="#00796b">Call payoff = 50</text><text x="535" y="294" font-family="Noto Sans Thai,Arial,sans-serif" font-size="34" fill="#6200ee">หุ้น 50</text><text x="535" y="334" font-family="Noto Sans Thai,Arial,sans-serif" font-size="26" fill="#00796b">Call payoff = 0</text></svg>