<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" width="900" height="1080" role="img" aria-labelledby="kolmogorov-title kolmogorov-desc"><title id="kolmogorov-title">Forward and backward transition-density bookkeeping</title><desc id="kolmogorov-desc">Two vertically stacked symmetric trinomial diagrams with 0 &lt; alpha &lt; 1/2. Forward: hold the start y,t fixed and collect incoming probability from z+h, z, and z-h at T-delta t into z at T, with probabilities alpha, 1-2alpha, and alpha. Differentiate with respect to terminal state z and terminal time T. Backward: hold the eventual target z,T fixed and condition from y at t on the next states y+h, y, and y-h at t+delta t using the same probabilities. Differentiate with respect to initial state y and initial time t. Both panels show transitions advancing in time.</desc><!-- svg-source:excalidraw --><metadata/><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="900" height="1080" fill="#ffffff"/><g stroke-linecap="round" transform="translate(0 0) rotate(0 450 540)"><path d="M0 0 L900 0 L900 1080 L0 1080" stroke="none" stroke-width="0" fill="#FFFFFF"/><path d="M0 0 C338.23 0, 676.47 0, 900 0 M0 0 C306.56 0, 613.13 0, 900 0 M900 0 C900 273.44, 900 546.87, 900 1080 M900 0 C900 261.42, 900 522.85, 900 1080 M900 1080 C637.72 1080, 375.45 1080, 0 1080 M900 1080 C679.72 1080, 459.43 1080, 0 1080 M0 1080 C0 787.92, 0 495.85, 0 0 M0 1080 C0 736.31, 0 392.62, 0 0" stroke="#FFFFFF" stroke-width="2" fill="none"/></g><g transform="translate(40 32) rotate(0 410 18.75)"><text x="0" y="26.8505859375" font-family="Helvetica, Segoe UI Emoji" font-size="30px" fill="#212121" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Forward: collect incoming probability</text></g><g transform="translate(40 78) rotate(0 410 13.75)"><text x="0" y="19.6904296875" font-family="Helvetica, Segoe UI Emoji" font-size="22px" fill="#666666" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Fix the start (y, t).   Symmetric step: 0 &lt; α &lt; 1/2.</text></g><g transform="translate(70 130) rotate(0 90 15)"><text x="90" y="21.48046875" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#666666" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">T − Δt</text></g><g transform="translate(655 130) rotate(0 90 15)"><text x="90" y="21.48046875" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#666666" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">T</text></g><g stroke-linecap="round"><g transform="translate(260 210) rotate(0 192.5 50)"><path d="M0 0 C136.92 35.56, 273.85 71.13, 385 100 M0 0 C123.44 32.06, 246.87 64.12, 385 100" stroke="#888888" stroke-width="2" fill="none"/></g><g transform="translate(260 210) rotate(0 192.5